                    }
                  }
                }
              ]
            }
          },
          "cpuUsage": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "CPU Usage", "description": "Total CPU cores consumed by namespace" },
              "plugin": {
                "kind": "TimeSeriesChart",
                "spec": {
                  "yAxis": { "show": true, "label": "CPU cores" }
                }
              },
              "queries": [
                {
                  "kind": "TimeSeriesQuery",
                  "spec": {
                    "plugin": {
                      "kind": "PrometheusTimeSeriesQuery",
                      "spec": { "query": "sum(rate(container_cpu_usage_seconds_total{container!=\"\",image!=\"\"}[5m])) by (namespace)" }
                    }
                  }
                }
              ]
            }
          },
          "memoryUsage": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Memory Usage", "description": "Total memory working set by namespace" },
              "plugin": {
                "kind": "TimeSeriesChart",
                "spec": {
                  "yAxis": { "show": true, "label": "Memory", "format": { "unit": "bytes" } }
                }
              },
              "queries": [
                {
                  "kind": "TimeSeriesQuery",
                  "spec": {
                    "plugin": {
                      "kind": "PrometheusTimeSeriesQuery",
                      "spec": { "query": "sum(container_memory_working_set_bytes{container!=\"\",image!=\"\"}) by (namespace)" }
