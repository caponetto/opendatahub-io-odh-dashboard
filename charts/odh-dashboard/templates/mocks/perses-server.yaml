{{- if .Values.mocks.perses.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: perses-config
data:
  config.yaml: |
    provisioning:
      folders:
        - /etc/perses/provisioning
      interval: 1h
    database:
      file:
        folder: /tmp/perses/data
        extension: yaml
    schemas:
      panels_path: /etc/perses/schemas/panels
      queries_path: /etc/perses/schemas/queries
      datasources_path: /etc/perses/schemas/datasources
      variables_path: /etc/perses/schemas/variables
      interval: 5m
    security:
      readonly: false
      enable_auth: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: perses-provisioning
data:
  globaldatasource-prometheus.json: |
    {
      "kind": "GlobalDatasource",
      "metadata": {
        "name": "PrometheusDemo",
        "createdAt": "2025-01-15T10:00:00Z",
        "updatedAt": "2025-01-15T10:00:00Z",
        "version": 1
      },
      "spec": {
        "default": true,
        "plugin": {
          "kind": "PrometheusDatasource",
          "spec": {
            "proxy": {
              "kind": "HTTPProxy",
              "spec": {
                "url": "http://thanos-querier.{{ .Release.Namespace }}.svc.cluster.local:9090"
              }
            }
          }
        }
      }
    }
  project-odh-monitoring.json: |
    {
      "kind": "Project",
      "metadata": {
        "name": "odh-monitoring",
        "createdAt": "2025-01-15T10:00:00Z",
        "updatedAt": "2025-01-15T10:00:00Z",
        "version": 1
      },
      "spec": {}
    }
  dashboard-0-cluster-admin.json: |
    {
      "kind": "Dashboard",
      "metadata": {
        "name": "dashboard-0-cluster-admin",
        "project": "odh-monitoring",
        "createdAt": "2025-01-15T10:00:00Z",
        "updatedAt": "2025-01-15T10:00:00Z",
        "version": 1
      },
      "spec": {
        "display": { "name": "Cluster Overview (Admin)" },
        "duration": "30m",
        "variables": [],
        "panels": {
          "cpuByNs": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "CPU Usage by Namespace", "description": "CPU cores consumed per namespace" },
              "plugin": {
                "kind": "TimeSeriesChart",
                "spec": {
                  "yAxis": { "show": true, "label": "CPU cores" }
                }
              },
              "queries": [
                {
                  "kind": "TimeSeriesQuery",
                  "spec": {
                    "plugin": {
                      "kind": "PrometheusTimeSeriesQuery",
                      "spec": { "query": "sum(rate(container_cpu_usage_seconds_total{container!=\"\",image!=\"\"}[5m])) by (namespace)" }
                    }
                  }
                }
              ]
            }
          },
          "memByNs": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Memory Usage by Namespace", "description": "Working-set memory per namespace" },
              "plugin": {
                "kind": "TimeSeriesChart",
                "spec": {
                  "yAxis": { "show": true, "label": "Memory", "format": { "unit": "bytes" } }
                }
              },
              "queries": [
                {
                  "kind": "TimeSeriesQuery",
                  "spec": {
                    "plugin": {
                      "kind": "PrometheusTimeSeriesQuery",
                      "spec": { "query": "sum(container_memory_working_set_bytes{container!=\"\",image!=\"\"}) by (namespace)" }
                    }
                  }
                }
              ]
            }
          },
          "runningContainers": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Running Containers", "description": "Total running containers by namespace" },
              "plugin": {
                "kind": "StatChart",
                "spec": { "format": { "unit": "decimal" } }
              },
              "queries": [
                {
                  "kind": "TimeSeriesQuery",
                  "spec": {
                    "plugin": {
                      "kind": "PrometheusTimeSeriesQuery",
                      "spec": { "query": "count(container_last_seen{container!=\"\",image!=\"\"}) by (namespace)" }
                    }
                  }
                }
              ]
            }
          },
          "networkReceive": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Network Receive Rate", "description": "Bytes received per second by namespace" },
              "plugin": {
                "kind": "TimeSeriesChart",
                "spec": {
                  "yAxis": { "show": true, "label": "bytes/s", "format": { "unit": "bytes" } }
                }
              },
              "queries": [
                {
                  "kind": "TimeSeriesQuery",
                  "spec": {
                    "plugin": {
                      "kind": "PrometheusTimeSeriesQuery",
                      "spec": { "query": "sum(rate(container_network_receive_bytes_total[5m])) by (namespace)" }
                    }
                  }
                }
              ]
            }
          }
        },
        "layouts": [
          {
            "kind": "Grid",
            "spec": {
              "display": { "title": "Resource Usage", "collapse": { "open": true } },
              "items": [
                { "x": 0, "y": 0, "width": 8, "height": 6, "content": { "$ref": "#/spec/panels/cpuByNs" } },
                { "x": 8, "y": 0, "width": 8, "height": 6, "content": { "$ref": "#/spec/panels/memByNs" } },
                { "x": 16, "y": 0, "width": 8, "height": 6, "content": { "$ref": "#/spec/panels/runningContainers" } }
              ]
            }
          },
          {
            "kind": "Grid",
            "spec": {
              "display": { "title": "Network", "collapse": { "open": true } },
              "items": [
                { "x": 0, "y": 0, "width": 24, "height": 8, "content": { "$ref": "#/spec/panels/networkReceive" } }
              ]
            }
          }
        ]
      }
    }
  dashboard-1-model.json: |
    {
      "kind": "Dashboard",
      "metadata": {
        "name": "dashboard-1-model",
        "project": "odh-monitoring",
        "createdAt": "2025-01-15T10:00:00Z",
        "updatedAt": "2025-01-15T10:00:00Z",
        "version": 1
      },
      "spec": {
        "display": { "name": "Model Serving Resources" },
        "duration": "30m",
        "variables": [],
        "panels": {
          "cpuByContainer": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "CPU by Container", "description": "CPU usage per container in odh-dashboard namespace" },
              "plugin": {
                "kind": "TimeSeriesChart",
                "spec": {
                  "yAxis": { "show": true, "label": "CPU cores" }
                }
              },
              "queries": [
                {
                  "kind": "TimeSeriesQuery",
                  "spec": {
                    "plugin": {
                      "kind": "PrometheusTimeSeriesQuery",
                      "spec": { "query": "sum(rate(container_cpu_usage_seconds_total{namespace=\"{{ .Release.Namespace }}\",container!=\"\",image!=\"\"}[5m])) by (container)" }
                    }
                  }
                }
              ]
            }
          },
          "memByContainer": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Memory by Container", "description": "Memory working set per container in odh-dashboard namespace" },
              "plugin": {
                "kind": "TimeSeriesChart",
                "spec": {
                  "yAxis": { "show": true, "label": "Memory", "format": { "unit": "bytes" } }
                }
              },
              "queries": [
                {
                  "kind": "TimeSeriesQuery",
                  "spec": {
                    "plugin": {
                      "kind": "PrometheusTimeSeriesQuery",
                      "spec": { "query": "sum(container_memory_working_set_bytes{namespace=\"{{ .Release.Namespace }}\",container!=\"\",image!=\"\"}) by (container)" }
                    }
                  }
                }
              ]
            }
          },
          "cpuThrottling": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "CPU Throttling", "description": "Percentage of throttled CPU periods per container" },
              "plugin": {
                "kind": "TimeSeriesChart",
                "spec": {
                  "yAxis": { "show": true, "label": "Throttled %", "format": { "unit": "percent" } }
                }
              },
              "queries": [
                {
                  "kind": "TimeSeriesQuery",
                  "spec": {
                    "plugin": {
                      "kind": "PrometheusTimeSeriesQuery",
                      "spec": { "query": "sum(rate(container_cpu_cfs_throttled_periods_total{namespace=\"{{ .Release.Namespace }}\",container!=\"\"}[5m])) by (container) / sum(rate(container_cpu_cfs_periods_total{namespace=\"{{ .Release.Namespace }}\",container!=\"\"}[5m])) by (container) * 100" }
                    }
                  }
                }
              ]
            }
          },
          "fsUsage": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Filesystem Usage", "description": "Container filesystem usage in odh-dashboard namespace" },
              "plugin": {
                "kind": "TimeSeriesChart",
                "spec": {
                  "yAxis": { "show": true, "label": "Usage", "format": { "unit": "bytes" } }
                }
              },
              "queries": [
                {
                  "kind": "TimeSeriesQuery",
                  "spec": {
                    "plugin": {
                      "kind": "PrometheusTimeSeriesQuery",
                      "spec": { "query": "sum(container_fs_usage_bytes{namespace=\"{{ .Release.Namespace }}\",container!=\"\",image!=\"\"}) by (container)" }
                    }
                  }
                }
              ]
            }
          }
        },
        "layouts": [
          {
            "kind": "Grid",
            "spec": {
              "display": { "title": "Compute", "collapse": { "open": true } },
              "items": [
                { "x": 0, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/cpuByContainer" } },
                { "x": 12, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/memByContainer" } }
              ]
            }
          },
          {
            "kind": "Grid",
            "spec": {
              "display": { "title": "Health", "collapse": { "open": true } },
              "items": [
                { "x": 0, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/cpuThrottling" } },
                { "x": 12, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/fsUsage" } }
              ]
            }
          }
        ]
      }
    }
  dashboard-2-workloads.json: |
    {
      "kind": "Dashboard",
      "metadata": {
        "name": "dashboard-2-workloads",
        "project": "odh-monitoring",
        "createdAt": "2025-01-15T10:00:00Z",
        "updatedAt": "2025-01-15T10:00:00Z",
        "version": 1
      },
      "spec": {
        "display": { "name": "Workload Metrics" },
        "duration": "30m",
        "variables": [],
        "panels": {
