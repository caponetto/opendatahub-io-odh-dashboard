        "layouts": [
          {
            "kind": "Grid",
            "spec": {
              "display": { "title": "Workload Overview", "collapse": { "open": true } },
              "items": [
                { "x": 0, "y": 0, "width": 8, "height": 6, "content": { "$ref": "#/spec/panels/containerCount" } },
                { "x": 8, "y": 0, "width": 8, "height": 6, "content": { "$ref": "#/spec/panels/cpuUsage" } },
                { "x": 16, "y": 0, "width": 8, "height": 6, "content": { "$ref": "#/spec/panels/memoryUsage" } }
