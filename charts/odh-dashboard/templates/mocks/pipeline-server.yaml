{{- if .Values.mocks.pipeline.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-pipeline-nginx-conf
  namespace: {{ include "odh-dashboard.sampleNamespace" $ }}
data:
  nginx.conf: |
    worker_processes 1;
    error_log /var/log/nginx/error.log warn;
    pid       /tmp/nginx.pid;

    events {
        worker_connections 64;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/json;
        access_log    /var/log/nginx/access.log;

        server {
            listen 8080;
            server_name _;

            root /usr/share/nginx/html;

            # Health check
            location = /healthz {
                return 200 '{"status":"ok"}';
            }

            # --- Pipelines ---
            location = /apis/v2beta1/pipelines {
                try_files /responses/pipelines.json =404;
            }
            location = /apis/v2beta1/pipelines/7a9b1c2d-3e4f-5a6b-8c9d-0e1f2a3b4c5d {
                try_files /responses/pipeline-iris.json =404;
            }
            location = /apis/v2beta1/pipelines/7a9b1c2d-3e4f-5a6b-8c9d-0e1f2a3b4c5d/versions {
                try_files /responses/pipeline-iris-versions.json =404;
            }
            location = /apis/v2beta1/pipelines/1f2e3d4c-5b6a-7890-abcd-ef1234567890 {
                try_files /responses/pipeline-preprocessing.json =404;
            }
            location = /apis/v2beta1/pipelines/1f2e3d4c-5b6a-7890-abcd-ef1234567890/versions {
                try_files /responses/pipeline-preprocessing-versions.json =404;
            }

            # --- Experiments ---
            location = /apis/v2beta1/experiments {
                try_files /responses/experiments.json =404;
            }

            # --- Pipeline version by ID ---
            location ~ ^/apis/v2beta1/pipelines/7a9b1c2d-3e4f-5a6b-8c9d-0e1f2a3b4c5d/versions/a1b2c3d4-e5f6-7890-abcd-111111111111$ {
                try_files /responses/version-iris-v1.json =404;
            }
            location ~ ^/apis/v2beta1/pipelines/7a9b1c2d-3e4f-5a6b-8c9d-0e1f2a3b4c5d/versions/b2c3d4e5-f6a7-8901-bcde-222222222222$ {
                try_files /responses/version-iris-v2.json =404;
            }
            location ~ ^/apis/v2beta1/pipelines/1f2e3d4c-5b6a-7890-abcd-ef1234567890/versions/c3d4e5f6-a7b8-9012-cdef-333333333333$ {
                try_files /responses/version-preprocessing-v1.json =404;
            }

            # --- Runs ---
            location = /apis/v2beta1/runs {
                try_files /responses/runs.json =404;
            }
            location = /apis/v2beta1/runs/run-001-1111-2222-3333-444455550001 {
                try_files /responses/run-001.json =404;
            }
            location = /apis/v2beta1/runs/run-002-1111-2222-3333-444455550002 {
                try_files /responses/run-002.json =404;
            }
            location = /apis/v2beta1/runs/run-003-1111-2222-3333-444455550003 {
                try_files /responses/run-003.json =404;
            }

            # --- Recurring Runs ---
            location = /apis/v2beta1/recurringRuns {
                try_files /responses/recurring-runs.json =404;
            }
            location = /apis/v2beta1/recurring_runs {
                try_files /responses/recurring-runs.json =404;
            }

            # --- Executions ---
            location = /apis/v2beta1/executions {
                try_files /responses/executions.json =404;
            }

            # --- Artifacts ---
            location = /apis/v2beta1/artifacts {
                try_files /responses/artifacts.json =404;
            }

            # Catch-all: return empty JSON
            location / {
                return 200 '{}';
            }
        }
    }
---
