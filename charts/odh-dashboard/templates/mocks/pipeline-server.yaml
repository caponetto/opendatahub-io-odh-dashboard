apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-pipeline-server
  namespace: {{ include "odh-dashboard.sampleNamespace" $ }}
  labels:
    app: mock-pipeline-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-pipeline-server
  template:
    metadata:
      labels:
        app: mock-pipeline-server
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: nginx
          image: {{ .Values.mocks.pipeline.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: responses
              mountPath: /usr/share/nginx/html/responses
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: nginx-conf
          configMap:
            name: mock-pipeline-nginx-conf
        - name: responses
          configMap:
            name: mock-pipeline-responses
---
apiVersion: v1
kind: Service
metadata:
  name: ds-pipeline-dspa
  namespace: {{ include "odh-dashboard.sampleNamespace" $ }}
  labels:
    app: mock-pipeline-server
spec:
  selector:
    app: mock-pipeline-server
  ports:
    - name: http
      port: 8443
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
{{- if .Values.route.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ds-pipeline-dspa
  namespace: {{ include "odh-dashboard.sampleNamespace" $ }}
  labels:
    app: mock-pipeline-server
spec:
  to:
    kind: Service
    name: ds-pipeline-dspa
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}

{{- end }}
