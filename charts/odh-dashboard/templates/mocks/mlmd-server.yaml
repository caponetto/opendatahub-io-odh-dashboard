{{- if .Values.mocks.pipeline.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlmd-envoy-config
  namespace: {{ include "odh-dashboard.sampleNamespace" $ }}
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: listener_0
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8443
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    codec_type: AUTO
                    stat_prefix: ingress_http
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: local_service
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/"
                              route:
                                cluster: mlmd_grpc
                                timeout: 0s
                                max_stream_duration:
                                  grpc_timeout_header_max: 0s
                          cors:
                            allow_origin_string_match:
                              - prefix: "*"
                            allow_methods: GET, PUT, DELETE, POST, OPTIONS
                            allow_headers: keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,custom-header-1,x-accept-content-transfer-encoding,x-accept-response-streaming,x-user-agent,x-grpc-web,grpc-timeout,authorization
                            max_age: "1728000"
                            expose_headers: grpc-status,grpc-message
                    http_filters:
                      - name: envoy.filters.http.grpc_web
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                      - name: envoy.filters.http.cors
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: mlmd_grpc
          connect_timeout: 0.25s
          type: STATIC
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: mlmd_grpc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlmd-grpc-config
  namespace: {{ include "odh-dashboard.sampleNamespace" $ }}
data:
  metadata_store_server_config.pb: |
    connection_config {
      sqlite {
        filename_uri: "/mlmd-data/metadata.sqlite.db"
        connection_mode: READWRITE_OPENCREATE
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-mlmd-server
  namespace: {{ include "odh-dashboard.sampleNamespace" $ }}
  labels:
    app: mock-mlmd-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-mlmd-server
  template:
    metadata:
      labels:
        app: mock-mlmd-server
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: mlmd-grpc
          image: {{ .Values.mocks.pipeline.mlmdImage }}
          args:
            - "--metadata_store_server_config_file=/config/metadata_store_server_config.pb"
            - "--grpc_port=8080"
          ports:
            - containerPort: 8080
              name: grpc
          securityContext:
            {{- if not .Values.route.enabled }}
            runAsUser: 65534
            {{- end }}
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: grpc-config
              mountPath: /config
              readOnly: true
            - name: mlmd-data
              mountPath: /mlmd-data
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
        - name: envoy
          image: {{ .Values.mocks.pipeline.envoyImage }}
          args:
            - "--config-path"
            - "/etc/envoy/envoy.yaml"
          ports:
            - containerPort: 8443
              name: grpc-web
          securityContext:
            {{- if not .Values.route.enabled }}
            runAsUser: 65534
            {{- end }}
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: grpc-config
          configMap:
            name: mlmd-grpc-config
        - name: envoy-config
          configMap:
            name: mlmd-envoy-config
        - name: mlmd-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ds-pipeline-mlmd
  namespace: {{ include "odh-dashboard.sampleNamespace" $ }}
  labels:
    app: mock-mlmd-server
spec:
  selector:
    app: mock-mlmd-server
  ports:
    - name: grpc-web
      port: 8443
      targetPort: 8443
      protocol: TCP
  type: ClusterIP
{{- end }}
