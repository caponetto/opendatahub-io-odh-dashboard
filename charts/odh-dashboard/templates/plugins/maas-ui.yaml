{{- if .Values.plugins.maas.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-ui
  labels:
    app: maas-ui
    {{- include "odh-dashboard.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maas-ui
  template:
    metadata:
      labels:
        app: maas-ui
    spec:
      serviceAccount: {{ include "odh-dashboard.serviceAccountName" . }}
      containers:
        - name: maas-ui
          image: "{{ .Values.plugins.maas.image.repository }}:{{ .Values.plugins.maas.image.tag }}"
          imagePullPolicy: {{ .Values.plugins.maas.image.pullPolicy }}
          ports:
            - containerPort: 8243
              name: http
          args:
            - "--deployment-mode=federated"
            - "--port=8243"
            - "--maas-subscription-namespace={{ .Release.Namespace }}"
            {{- if .Values.plugins.maas.mockHttpClient }}
            - "--mock-http-client"
            {{- end }}
          env:
            - name: MAAS_SUBSCRIPTION_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: TIERS_CONFIGMAP_NS
              value: {{ .Release.Namespace | quote }}
            - name: GATEWAY_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            {{- range $key, $value := .Values.plugins.maas.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8243
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8243
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.plugins.maas.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: maas-ui
  labels:
    app: maas-ui
    {{- include "odh-dashboard.labels" . | nindent 4 }}
spec:
  selector:
    app: maas-ui
  ports:
    - name: http
      port: 8243
      targetPort: 8243
      protocol: TCP
  type: ClusterIP
{{- end }}
