metadata:
  name: flan-t5-small
  namespace: {{ .Release.Namespace }}
spec:
  displayName: "Flan T5 Small"
  description: "Google Flan T5 small text-to-text transfer transformer model."
  modelRef:
    kind: LLMInferenceService
    name: flan-t5-small
---
# MaaS: MaaSSubscription (premium team)
