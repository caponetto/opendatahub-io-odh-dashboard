apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: small
  annotations:
    opendatahub.io/display-name: "Small"
    opendatahub.io/description: "Small profile for lightweight notebooks and experimentation."
    opendatahub.io/dashboard-feature-visibility: "[]"
    opendatahub.io/disabled: "false"
  labels:
    app.kubernetes.io/part-of: hardwareprofile
    app.opendatahub.io/hardwareprofile: "true"
spec:
  identifiers:
    - displayName: CPU
      identifier: cpu
      minCount: 1
      maxCount: 2
      defaultCount: 1
      resourceType: CPU
    - displayName: Memory
      identifier: memory
      minCount: 2Gi
      maxCount: 4Gi
      defaultCount: 2Gi
      resourceType: Memory
---
apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: medium
  annotations:
    opendatahub.io/display-name: "Medium"
    opendatahub.io/description: "Medium profile for general-purpose data science workloads."
    opendatahub.io/dashboard-feature-visibility: "[]"
    opendatahub.io/disabled: "false"
  labels:
    app.kubernetes.io/part-of: hardwareprofile
    app.opendatahub.io/hardwareprofile: "true"
spec:
  identifiers:
    - displayName: CPU
      identifier: cpu
      minCount: 2
      maxCount: 4
      defaultCount: 2
      resourceType: CPU
    - displayName: Memory
      identifier: memory
      minCount: 4Gi
      maxCount: 8Gi
      defaultCount: 4Gi
      resourceType: Memory
---
apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: large-gpu
  annotations:
    opendatahub.io/display-name: "Large with GPU"
    opendatahub.io/description: "Large profile for training and inference workloads with GPU acceleration."
    opendatahub.io/dashboard-feature-visibility: "[]"
    opendatahub.io/disabled: "false"
  labels:
    app.kubernetes.io/part-of: hardwareprofile
    app.opendatahub.io/hardwareprofile: "true"
spec:
  identifiers:
    - displayName: CPU
      identifier: cpu
      minCount: 4
      maxCount: 8
      defaultCount: 4
      resourceType: CPU
    - displayName: Memory
      identifier: memory
      minCount: 8Gi
      maxCount: 16Gi
      defaultCount: 8Gi
      resourceType: Memory
    - displayName: NVIDIA GPU
      identifier: nvidia.com/gpu
      minCount: 1
      maxCount: 4
      defaultCount: 1
      resourceType: Accelerator
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: s3-compatible-storage
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/connection-type: "true"
  annotations:
    openshift.io/display-name: "S3 Compatible Storage"
    openshift.io/description: "Connect to an S3-compatible object storage bucket (AWS S3, MinIO, Ceph, etc.)"
    opendatahub.io/disabled: "false"
    opendatahub.io/username: "system"
data:
  category: '["Object storage"]'
  fields: '[{"type":"section","name":"S3 Configuration","description":"Provide S3 endpoint and bucket details."},{"type":"short-text","name":"Endpoint URL","description":"The S3 endpoint URL","envVar":"AWS_S3_ENDPOINT","required":true,"properties":{}},{"type":"short-text","name":"Bucket","description":"The name of the S3 bucket","envVar":"AWS_S3_BUCKET","required":true,"properties":{}},{"type":"short-text","name":"Region","description":"The AWS region (e.g. us-east-1)","envVar":"AWS_DEFAULT_REGION","required":false,"properties":{}},{"type":"short-text","name":"Access Key ID","description":"Your AWS access key ID","envVar":"AWS_ACCESS_KEY_ID","required":true,"properties":{}},{"type":"hidden","name":"Secret Access Key","description":"Your AWS secret access key","envVar":"AWS_SECRET_ACCESS_KEY","required":true,"properties":{}}]'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-database
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/connection-type: "true"
  annotations:
    openshift.io/display-name: "PostgreSQL Database"
    openshift.io/description: "Connect to a PostgreSQL database instance."
    opendatahub.io/disabled: "false"
    opendatahub.io/username: "system"
data:
  category: '["Database"]'
  fields: '[{"type":"section","name":"Database Connection","description":"PostgreSQL connection details."},{"type":"short-text","name":"Host","description":"The database hostname or IP","envVar":"PGHOST","required":true,"properties":{}},{"type":"short-text","name":"Port","description":"The database port (default: 5432)","envVar":"PGPORT","required":false,"properties":{"defaultValue":"5432"}},{"type":"short-text","name":"Database","description":"The database name","envVar":"PGDATABASE","required":true,"properties":{}},{"type":"short-text","name":"Username","description":"The database username","envVar":"PGUSER","required":true,"properties":{}},{"type":"hidden","name":"Password","description":"The database password","envVar":"PGPASSWORD","required":true,"properties":{}}]'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: generic-uri
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/connection-type: "true"
  annotations:
    openshift.io/display-name: "URI Connection"
    openshift.io/description: "A generic URI-based connection for any service endpoint."
    opendatahub.io/disabled: "false"
    opendatahub.io/username: "system"
data:
  category: '["General"]'
  fields: '[{"type":"uri","name":"URI","description":"The URI for the service","envVar":"URI","required":true,"properties":{}}]'
