# Sample ModelRegistry instances (shown in Model Registry Settings)
apiVersion: modelregistry.opendatahub.io/v1beta1
kind: ModelRegistry
metadata:
  name: default-registry
  annotations:
    openshift.io/display-name: "Default Model Registry"
    openshift.io/description: "Central model registry for tracking ML models"
spec:
  grpc:
    port: 9090
  rest:
    port: 8080
    serviceRoute: "http://default-registry.{{ .Release.Namespace }}.svc.cluster.local:8080"
  postgres:
    database: model_registry
    host: postgres.{{ .Release.Namespace }}.svc.cluster.local
    port: 5432
    skipDBCreation: false
    username: mlmduser
    passwordSecret:
      name: default-registry-db-credentials
      key: password
---
apiVersion: modelregistry.opendatahub.io/v1beta1
kind: ModelRegistry
metadata:
  name: team-nlp-registry
  annotations:
    openshift.io/display-name: "NLP Team Registry"
    openshift.io/description: "Model registry for the NLP team"
spec:
  grpc:
    port: 9090
  rest:
    port: 8080
    serviceRoute: "http://team-nlp-registry.{{ .Release.Namespace }}.svc.cluster.local:8080"
  postgres:
    database: nlp_model_registry
    host: postgres.{{ .Release.Namespace }}.svc.cluster.local
    port: 5432
    skipDBCreation: false
    username: mlmduser
    passwordSecret:
      name: team-nlp-registry-db-credentials
      key: password
---
# Default catalog sources ConfigMap (BFF reads from "default-catalog-sources" with key "sources.yaml")
# The BFF parser expects root key "catalogs:" and nested "properties:" for type-specific fields
apiVersion: v1
kind: ConfigMap
metadata:
  name: default-catalog-sources
data:
  sources.yaml: |
    catalogs:
      - id: red_hat_models
        name: Red Hat Models
        type: yaml
        enabled: true
        properties:
          yamlCatalogPath: red_hat_models.yaml
        labels:
          - validated
          - production-ready
      - id: community_models
        name: Community Models
        type: hf
        enabled: true
        properties:
          allowedOrganization: instructlab
        labels:
          - community
          - experimental
  red_hat_models.yaml: |
    models:
      - name: granite-8b-code-instruct
        description: "IBM Granite 8B model fine-tuned for code generation"
        labels:
          - Code Generation
          - Validated
      - name: llama-3-8b-instruct
        description: "Meta Llama 3 8B model fine-tuned for instruction following"
        labels:
          - NLP
          - Validated
---
# User-managed catalog sources ConfigMap (BFF reads from "model-catalog-sources" with key "sources.yaml")
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-catalog-sources
data:
  sources.yaml: ""
---
# Grant the model-registry BFF's kubeflow-userid identity cluster-admin access
# so SubjectAccessReview checks pass for the injected user
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeflow-userid-admin
subjects:
  - kind: User
    name: {{ .Values.federation.kubeflowUserId }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
# Template wrapping a vLLM ServingRuntime for the settings/serving-runtimes page
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: vllm-runtime-template
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    opendatahub.io/modelServingSupport: '["single"]'
    opendatahub.io/apiProtocol: REST
    opendatahub.io/model-type: '["generative_ai"]'
objects:
  - apiVersion: serving.kserve.io/v1alpha1
    kind: ServingRuntime
    metadata:
      name: vllm-runtime
      annotations:
        openshift.io/display-name: vLLM ServingRuntime for KServe
        opendatahub.io/runtime-version: "1.0.0"
      labels:
        opendatahub.io/dashboard: "true"
    spec:
      containers:
        - name: kserve-container
          image: quay.io/modh/vllm:v0.6.4
          args:
            - "--port=8080"
            - "--model=/mnt/models"
          resources:
            limits:
              cpu: "2"
              memory: 8Gi
            requests:
              cpu: "1"
              memory: 4Gi
          ports:
            - containerPort: 8080
              protocol: TCP
      supportedModelFormats:
        - name: vLLM
          autoSelect: true
      protocolVersions:
        - v2
        - grpc-v2
parameters: []
{{- end }}
