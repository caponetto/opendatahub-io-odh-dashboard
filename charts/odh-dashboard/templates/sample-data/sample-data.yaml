kind: MaaSSubscription
metadata:
  name: premium-team-sub
  namespace: {{ .Release.Namespace }}
spec:
  displayName: "Premium Team Subscription"
  description: "High-priority subscription for the premium team with extended token limits."
  priority: 10
  owner:
    groups:
      - name: premium-users
  modelRefs:
    - name: granite-3-8b-instruct
      namespace: {{ .Release.Namespace }}
      tokenRateLimits:
        - limit: 100000
          window: "24h"
    - name: flan-t5-small
      namespace: {{ .Release.Namespace }}
      tokenRateLimits:
        - limit: 200000
          window: "24h"
---
# MaaS: MaaSSubscription (basic team)
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: basic-team-sub
  namespace: {{ .Release.Namespace }}
spec:
  displayName: "Basic Team Subscription"
  description: "Standard subscription for general team access."
  priority: 0
  owner:
    groups:
      - name: system:authenticated
  modelRefs:
    - name: flan-t5-small
