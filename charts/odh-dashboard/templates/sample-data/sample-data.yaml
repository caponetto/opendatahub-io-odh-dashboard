      tokenRateLimits:
        - limit: 10000
          window: "24h"
---
# MaaS: MaaSAuthPolicy (premium team)
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: premium-team-policy
  namespace: {{ .Release.Namespace }}
spec:
  displayName: "Premium Team Policy"
  description: "High-priority access policy for the premium team."
  modelRefs:
    - name: granite-3-8b-instruct
      namespace: {{ .Release.Namespace }}
    - name: flan-t5-small
      namespace: {{ .Release.Namespace }}
  subjects:
    groups:
      - name: premium-users
---
# MaaS: MaaSAuthPolicy (basic team)
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: basic-team-policy
  namespace: {{ .Release.Namespace }}
