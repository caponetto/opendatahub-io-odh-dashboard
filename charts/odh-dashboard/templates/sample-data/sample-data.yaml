  img: >-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><path fill="#009596" d="M18 2C9.163 2 2 9.163 2 18s7.163 16 16 16 16-7.163 16-16S26.837 2 18 2zm0 29C10.82 31 5 25.18 5 18S10.82 5 18 5s13 5.82 13 13-5.82 13-13 13z"/><path fill="#009596" d="M18 8c-5.523 0-10 4.477-10 10s4.477 10 10 10 10-4.477 10-10S23.523 8 18 8zm0 17c-3.866 0-7-3.134-7-7s3.134-7 7-7 7 3.134 7 7-3.134 7-7 7z"/><circle fill="#F0AB00" cx="18" cy="18" r="4"/></svg>
  displayName: TrustyAI
  description: >-
    Monitor deployed models for fairness, bias, and explainability
    with AI/ML model trustworthiness tooling.
  provider: Open Data Hub
  support: Open Data Hub community
  docsLink: "https://opendatahub.io/docs/trustyai/"
  getStartedLink: "https://opendatahub.io/docs/trustyai/"
  getStartedMarkDown: >-
    # TrustyAI


    Monitor your ML models for fairness and explainability.


    ## Getting Started


    1. Deploy a TrustyAI service instance in your project.

    2. Connect it to your model serving endpoints.

