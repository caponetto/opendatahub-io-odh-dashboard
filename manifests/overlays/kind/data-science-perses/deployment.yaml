---
apiVersion: v1
kind: ConfigMap
metadata:
  name: perses-nginx-conf
  namespace: odh-dashboard
data:
  nginx.conf: |
    worker_processes 1;
    error_log /var/log/nginx/error.log warn;
    pid       /tmp/nginx.pid;

    events {
        worker_connections 64;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/json;
        access_log    /var/log/nginx/access.log;

        server {
            listen 8080;
            server_name _;

            root /usr/share/nginx/html;

            location = /healthz {
                return 200 '{"status":"ok"}';
            }

            # GET /api/v1/dashboards
            location = /api/v1/dashboards {
                try_files /responses/dashboards.json =404;
            }

            # GET /api/v1/projects
            location = /api/v1/projects {
                return 200 '[]';
            }

            # Global datasources -- Prometheus datasource used by dashboard panels
            location = /api/v1/globaldatasources {
                try_files /responses/globaldatasources.json =404;
            }
            location ~ ^/api/v1/projects/.*/datasources {
                return 200 '[]';
            }

            # Proxy datasource queries -- return empty so panels show "no data" instead of errors
            location ~ ^/proxy/ {
                return 200 '{"status":"success","data":{"resultType":"matrix","result":[]}}';
            }

            # Catch-all
            location / {
                return 200 '{}';
            }
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: perses-responses
  namespace: odh-dashboard
data:
  globaldatasources.json: |
    [
      {
        "kind": "GlobalDatasource",
        "metadata": {
          "name": "PrometheusDemo",
          "createdAt": "2025-01-15T10:00:00Z",
          "updatedAt": "2025-01-15T10:00:00Z",
          "version": 1
        },
        "spec": {
          "default": true,
          "plugin": {
            "kind": "PrometheusDatasource",
            "spec": {
              "proxy": {
                "kind": "HTTPProxy",
                "spec": {
                  "url": "http://localhost:8080"
                }
              }
            }
          }
        }
      }
    ]
  dashboards.json: |
    [
      {
        "kind": "Dashboard",
        "metadata": {
          "name": "dashboard-0-cluster-admin",
          "project": "odh-monitoring",
          "createdAt": "2025-01-15T10:00:00Z",
          "updatedAt": "2025-01-15T10:00:00Z",
          "version": 1
        },
        "spec": {
          "display": { "name": "Cluster Overview (Admin)" },
          "duration": "30m",
          "variables": [],
          "panels": {
            "gpuUtilization": {
              "kind": "Panel",
              "spec": {
                "display": { "name": "GPU Utilization", "description": "GPU utilization across inference nodes" },
                "plugin": {
                  "kind": "TimeSeriesChart",
                  "spec": {
                    "yAxis": { "show": true, "label": "Utilization %", "format": { "unit": "percent" } }
                  }
                },
                "queries": [
                  {
                    "kind": "TimeSeriesQuery",
                    "spec": {
                      "plugin": {
                        "kind": "PrometheusTimeSeriesQuery",
                        "spec": { "query": "avg(DCGM_FI_DEV_GPU_UTIL) by (node)" }
                      }
                    }
                  }
                ]
              }
            },
            "gpuMemory": {
              "kind": "Panel",
              "spec": {
                "display": { "name": "GPU Memory Used", "description": "GPU memory consumption across nodes" },
                "plugin": {
                  "kind": "TimeSeriesChart",
                  "spec": {
                    "yAxis": { "show": true, "label": "Memory (GiB)", "format": { "unit": "bytes" } }
                  }
                },
                "queries": [
                  {
                    "kind": "TimeSeriesQuery",
                    "spec": {
                      "plugin": {
                        "kind": "PrometheusTimeSeriesQuery",
                        "spec": { "query": "avg(DCGM_FI_DEV_FB_USED) by (node) / 1024" }
                      }
                    }
                  }
                ]
              }
            },
            "activeModels": {
              "kind": "Panel",
              "spec": {
                "display": { "name": "Active Inference Endpoints", "description": "Number of InferenceService endpoints in Ready state" },
                "plugin": {
                  "kind": "StatChart",
                  "spec": { "format": { "unit": "decimal" } }
                },
                "queries": [
                  {
                    "kind": "TimeSeriesQuery",
                    "spec": {
                      "plugin": {
                        "kind": "PrometheusTimeSeriesQuery",
                        "spec": { "query": "count(kserve_inference_service_ready == 1)" }
                      }
                    }
                  }
                ]
              }
            },
            "requestRate": {
              "kind": "Panel",
              "spec": {
                "display": { "name": "Inference Request Rate", "description": "Requests per second across all inference endpoints" },
                "plugin": {
                  "kind": "TimeSeriesChart",
                  "spec": {
                    "yAxis": { "show": true, "label": "req/s" }
                  }
                },
                "queries": [
                  {
                    "kind": "TimeSeriesQuery",
                    "spec": {
                      "plugin": {
                        "kind": "PrometheusTimeSeriesQuery",
                        "spec": { "query": "sum(rate(kserve_request_total[5m])) by (model_name)" }
                      }
                    }
                  }
                ]
              }
            }
          },
          "layouts": [
            {
              "kind": "Grid",
              "spec": {
                "display": { "title": "Infrastructure", "collapse": { "open": true } },
                "items": [
                  { "x": 0, "y": 0, "width": 8, "height": 6, "content": { "$ref": "#/spec/panels/gpuUtilization" } },
                  { "x": 8, "y": 0, "width": 8, "height": 6, "content": { "$ref": "#/spec/panels/gpuMemory" } },
                  { "x": 16, "y": 0, "width": 8, "height": 6, "content": { "$ref": "#/spec/panels/activeModels" } }
                ]
              }
            },
            {
              "kind": "Grid",
              "spec": {
                "display": { "title": "Inference Traffic", "collapse": { "open": true } },
                "items": [
                  { "x": 0, "y": 0, "width": 24, "height": 8, "content": { "$ref": "#/spec/panels/requestRate" } }
                ]
              }
            }
          ]
        }
      },
      {
        "kind": "Dashboard",
        "metadata": {
          "name": "dashboard-1-model",
          "project": "odh-monitoring",
          "createdAt": "2025-01-15T10:00:00Z",
          "updatedAt": "2025-01-15T10:00:00Z",
          "version": 1
        },
        "spec": {
          "display": { "name": "Model Performance" },
          "duration": "30m",
          "variables": [],
          "panels": {
            "latencyP50": {
              "kind": "Panel",
              "spec": {
                "display": { "name": "Inference Latency (p50)", "description": "50th percentile request latency" },
                "plugin": {
                  "kind": "TimeSeriesChart",
                  "spec": {
                    "yAxis": { "show": true, "label": "Latency (ms)", "format": { "unit": "milliseconds" } }
                  }
                },
                "queries": [
                  {
                    "kind": "TimeSeriesQuery",
                    "spec": {
                      "plugin": {
                        "kind": "PrometheusTimeSeriesQuery",
                        "spec": { "query": "histogram_quantile(0.5, sum(rate(kserve_request_duration_seconds_bucket[5m])) by (le, model_name))" }
                      }
                    }
                  }
                ]
              }
            },
            "latencyP99": {
              "kind": "Panel",
              "spec": {
                "display": { "name": "Inference Latency (p99)", "description": "99th percentile request latency" },
                "plugin": {
                  "kind": "TimeSeriesChart",
                  "spec": {
                    "yAxis": { "show": true, "label": "Latency (ms)", "format": { "unit": "milliseconds" } }
                  }
                },
                "queries": [
                  {
                    "kind": "TimeSeriesQuery",
                    "spec": {
                      "plugin": {
                        "kind": "PrometheusTimeSeriesQuery",
                        "spec": { "query": "histogram_quantile(0.99, sum(rate(kserve_request_duration_seconds_bucket[5m])) by (le, model_name))" }
                      }
                    }
                  }
                ]
              }
            },
            "tokensPerSec": {
              "kind": "Panel",
              "spec": {
                "display": { "name": "Token Throughput", "description": "Tokens generated per second by model" },
                "plugin": {
                  "kind": "TimeSeriesChart",
                  "spec": {
                    "yAxis": { "show": true, "label": "tokens/s" }
                  }
                },
                "queries": [
                  {
                    "kind": "TimeSeriesQuery",
                    "spec": {
                      "plugin": {
                        "kind": "PrometheusTimeSeriesQuery",
                        "spec": { "query": "sum(rate(llm_tokens_generated_total[5m])) by (model_name)" }
                      }
                    }
                  }
                ]
              }
            },
            "errorRate": {
              "kind": "Panel",
              "spec": {
                "display": { "name": "Error Rate", "description": "HTTP 5xx error rate per model" },
                "plugin": {
                  "kind": "TimeSeriesChart",
                  "spec": {
                    "yAxis": { "show": true, "label": "errors/s" }
                  }
                },
                "queries": [
                  {
                    "kind": "TimeSeriesQuery",
                    "spec": {
                      "plugin": {
                        "kind": "PrometheusTimeSeriesQuery",
                        "spec": { "query": "sum(rate(kserve_request_total{response_code=~\"5..\"}[5m])) by (model_name)" }
                      }
                    }
                  }
                ]
              }
            }
          },
          "layouts": [
            {
              "kind": "Grid",
              "spec": {
                "display": { "title": "Latency", "collapse": { "open": true } },
                "items": [
                  { "x": 0, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/latencyP50" } },
                  { "x": 12, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/latencyP99" } }
                ]
              }
            },
            {
              "kind": "Grid",
              "spec": {
                "display": { "title": "Throughput & Errors", "collapse": { "open": true } },
                "items": [
                  { "x": 0, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/tokensPerSec" } },
                  { "x": 12, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/errorRate" } }
                ]
              }
            }
          ]
        }
      },
      {
        "kind": "Dashboard",
        "metadata": {
          "name": "dashboard-2-workloads",
          "project": "odh-monitoring",
          "createdAt": "2025-01-15T10:00:00Z",
          "updatedAt": "2025-01-15T10:00:00Z",
          "version": 1
        },
        "spec": {
          "display": { "name": "Workload Metrics" },
          "duration": "30m",
          "variables": [],
          "panels": {
            "podCount": {
              "kind": "Panel",
              "spec": {
                "display": { "name": "Inference Pods", "description": "Running inference pods by namespace" },
                "plugin": {
                  "kind": "TimeSeriesChart",
                  "spec": {
                    "yAxis": { "show": true, "label": "Pods" }
                  }
                },
                "queries": [
                  {
                    "kind": "TimeSeriesQuery",
                    "spec": {
                      "plugin": {
                        "kind": "PrometheusTimeSeriesQuery",
                        "spec": { "query": "count(kube_pod_info{pod=~\".*predictor.*\"}) by (namespace)" }
                      }
                    }
                  }
                ]
              }
            },
            "cpuUsage": {
              "kind": "Panel",
              "spec": {
                "display": { "name": "CPU Usage", "description": "CPU cores consumed by inference workloads" },
                "plugin": {
                  "kind": "TimeSeriesChart",
                  "spec": {
                    "yAxis": { "show": true, "label": "CPU cores" }
                  }
                },
                "queries": [
                  {
                    "kind": "TimeSeriesQuery",
                    "spec": {
                      "plugin": {
                        "kind": "PrometheusTimeSeriesQuery",
                        "spec": { "query": "sum(rate(container_cpu_usage_seconds_total{pod=~\".*predictor.*\"}[5m])) by (namespace)" }
                      }
                    }
                  }
                ]
              }
            },
            "memoryUsage": {
              "kind": "Panel",
              "spec": {
                "display": { "name": "Memory Usage", "description": "Memory consumed by inference workloads" },
                "plugin": {
                  "kind": "TimeSeriesChart",
                  "spec": {
                    "yAxis": { "show": true, "label": "Memory (GiB)", "format": { "unit": "bytes" } }
                  }
                },
                "queries": [
                  {
                    "kind": "TimeSeriesQuery",
                    "spec": {
                      "plugin": {
                        "kind": "PrometheusTimeSeriesQuery",
                        "spec": { "query": "sum(container_memory_working_set_bytes{pod=~\".*predictor.*\"}) by (namespace)" }
                      }
                    }
                  }
                ]
              }
            },
            "restartCount": {
              "kind": "Panel",
              "spec": {
                "display": { "name": "Pod Restarts", "description": "Container restart count for inference pods" },
                "plugin": {
                  "kind": "StatChart",
                  "spec": { "format": { "unit": "decimal" } }
                },
                "queries": [
                  {
                    "kind": "TimeSeriesQuery",
                    "spec": {
                      "plugin": {
                        "kind": "PrometheusTimeSeriesQuery",
                        "spec": { "query": "sum(kube_pod_container_status_restarts_total{pod=~\".*predictor.*\"}) by (namespace)" }
                      }
                    }
                  }
                ]
              }
            }
          },
          "layouts": [
            {
              "kind": "Grid",
              "spec": {
                "display": { "title": "Workload Overview", "collapse": { "open": true } },
                "items": [
                  { "x": 0, "y": 0, "width": 8, "height": 6, "content": { "$ref": "#/spec/panels/podCount" } },
                  { "x": 8, "y": 0, "width": 8, "height": 6, "content": { "$ref": "#/spec/panels/cpuUsage" } },
                  { "x": 16, "y": 0, "width": 8, "height": 6, "content": { "$ref": "#/spec/panels/restartCount" } }
                ]
              }
            },
            {
              "kind": "Grid",
              "spec": {
                "display": { "title": "Resource Consumption", "collapse": { "open": true } },
                "items": [
                  { "x": 0, "y": 0, "width": 24, "height": 8, "content": { "$ref": "#/spec/panels/memoryUsage" } }
                ]
              }
            }
          ]
        }
      }
    ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-science-perses
  namespace: odh-dashboard
  labels:
    app: data-science-perses
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-science-perses
  template:
    metadata:
      labels:
        app: data-science-perses
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: responses
              mountPath: /usr/share/nginx/html/responses
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: nginx-conf
          configMap:
            name: perses-nginx-conf
        - name: responses
          configMap:
            name: perses-responses
---
apiVersion: v1
kind: Service
metadata:
  name: data-science-perses
  namespace: odh-dashboard
  labels:
    app: data-science-perses
spec:
  selector:
    app: data-science-perses
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
