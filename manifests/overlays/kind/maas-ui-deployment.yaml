apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-ui
  namespace: odh-dashboard
  labels:
    app: maas-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maas-ui
  template:
    metadata:
      labels:
        app: maas-ui
    spec:
      serviceAccount: odh-dashboard
      containers:
        - name: maas-ui
          image: maas-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8243
              name: http
          args:
            - '--deployment-mode=federated'
            - '--port=8243'
          env:
            - name: MOCK_K8S_CLIENT
              value: "true"
            - name: MOCK_HTTP_CLIENT
              value: "true"
            - name: DEV_MODE
              value: "true"
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8243
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8243
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: maas-ui
  namespace: odh-dashboard
  labels:
    app: maas-ui
spec:
  selector:
    app: maas-ui
  ports:
    - name: http
      port: 8243
      targetPort: 8243
      protocol: TCP
  type: ClusterIP
